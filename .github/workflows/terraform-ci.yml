name: Terraform CI

on:
  pull_request:
    branches:
      - infrastructure
    paths:
      - "infra/**"
      - ".github/workflows/terraform-ci.yml"

permissions:
  contents: read

jobs:
  terraform-check:
    name: Terraform Format and Validate
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: infra/environments/dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.17.1"

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive ../../

      - name: Initialize Terraform without backend
        run: terraform init -backend=false -input=false

      - name: Validate Terraform
        run: terraform validate -no-color

      - name: Write CI summary
        if: success()
        run: |
          echo "## Terraform CI" >> "$GITHUB_STEP_SUMMARY"
          echo "Formatting and validation passed." >> "$GITHUB_STEP_SUMMARY"
          echo "Cloud plan is pending GCS backend and OIDC setup." >> "$GITHUB_STEP_SUMMARY"
